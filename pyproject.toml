[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmoxie-analysis"
description = "Data analysis package for the llmoxie project"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Cordero Core", email = "cdcore09@gmail.com" }]
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/uw-ssec/llmoxie-analysis"
Repository = "https://github.com/uw-ssec/llmoxie-analysis.git"
Issues = "https://github.com/uw-ssec/llmoxie-analysis/issues"

[dependency-groups]
test = ["pytest>=8.0"]

[tool.hatch.version]
path = "src/llmoxie_analysis/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
