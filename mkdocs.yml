site_name: LLMoxie Analysis
site_description: >-
  Knowledge base for llmoxie-analysis — turning raw LLMoxie gateway request logs
  into a queryable Parquet warehouse of sessions, messages, and tool calls.
site_author: UW Scientific Software Engineering Center
repo_url: https://github.com/uw-ssec/llmoxie-analysis
repo_name: uw-ssec/llmoxie-analysis
edit_uri: edit/main/knowledge/

# Generated by scripts/gen_docs.py from the knowledge/ bundle plus
# docs/_overlay/. Never edited by hand, never committed.
docs_dir: site_docs
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
            # Any page that exists but never reaches the nav is a build failure under
            # --strict, not a silent omission. This is what guarantees a handwritten page
            # dropped into docs/_overlay/ actually gets displayed.


validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn

plugins:
  - search

# Derives the nav from the generated tree, so a new concept in the bundle
# appears in the site without a second list to maintain.
hooks:
  - hooks/nav.py
