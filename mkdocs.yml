site_name: LLMoxie Analysis
site_description: >-
  Documentation for llmoxie-analysis — turning raw LLMoxie gateway request logs
  into a queryable Parquet warehouse of sessions, messages, and tool calls.
site_author: UW Scientific Software Engineering Center
repo_url: https://github.com/uw-ssec/llmoxie-analysis
repo_name: uw-ssec/llmoxie-analysis
edit_uri: edit/main/docs/

docs_dir: docs
use_directory_urls: true

exclude_docs: |
  superpowers/

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Contributing: contributing.md

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  # Under --strict, a page missing from the nav or a broken link fails the build.
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn

plugins:
  - search
