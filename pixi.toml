[workspace]
# Project metadata and basic configuration
authors = ["Cordero Core <cdcore09@gmail.com>"] # Project authors
channels = ["https://prefix.dev/conda-forge", "https://prefix.dev/lsetiawan/uw-ssec"] # Conda channels for dependencies
name = "llmoxie-analysis" # Project name
platforms = ["osx-arm64", "linux-64", "linux-aarch64"] # Supported platforms for development and deployment
version = "0.1.0" # Project version

# The environment configurations for different development scenarios
[environments]
default = { features = ["pre-commit", "gh-cli", "docs"], solve-group = "default" } # The default development environment with pre-commit, GitHub CLI, and documentation tooling
onboard = { features = ["pre-commit", "gh-cli", "docs", "onboard"], solve-group = "default" } # The onboarding environment with additional setup tasks
evals = { features = ["pre-commit", "gh-cli", "evals"], solve-group = "evals" } # Skill-evaluation environment with Inspect and Harbor (own solve group: needs Python 3.12+)

# The project dependencies
[dependencies]
python = ">=3.11"
pytest = ">=9.1.1,<10"
okf-agent-memory = ">=0.4.0,<0.5"
ruff = ">=0.16.7,<0.17"
mypy = ">=2.3.1,<3"
python-build = ">=1.6.0,<2"
hatchling = ">=1.32.3,<2"

# The project dependencies from PyPI
[pypi-dependencies]
llmoxie-analysis = { path = ".", editable = true }

# The main project tasks
[tasks]
test = { cmd = "pytest", description = "Run the test suite with pytest" }
lint = { cmd = "ruff check . && ruff format --check .", description = "Lint and check formatting with ruff (no changes made)" }
typecheck = { cmd = "mypy", description = "Type-check src/ and tests/ with mypy (strict)" }
build = { cmd = "python -m build --wheel --sdist --no-isolation --outdir dist", description = "Build the wheel and sdist into dist/" }
okf-validate = { cmd = "okf validate --strict --drift", description = "Check the knowledge/ bundle; fails on errors and producer-gate findings, not on warnings" }
verify = { depends-on = [
    "pre-commit-all",
    "okf-validate",
    "typecheck",
    "test",
    { task = "inspect-smoke", environment = "evals" },
    "build",
], description = "The quality gate: format+lint, knowledge bundle, type-check, tests, skill evals (mock), build. Must exit 0 before commit or PR" }
setup = { cmd = "git submodule update --init --recursive", depends-on = [
    "pre-commit-install",
], description = "One-time setup after pixi install: git hooks and the read-only reference/ submodules" }

# GitHub CLI feature for interacting with GitHub from the command line
[feature.gh-cli.dependencies]
gh = ">=2.0.0"

# Pre-commit feature for code quality and consistency
[feature.pre-commit.dependencies]
pre-commit = ">=4.3.0"

[feature.pre-commit.tasks]
pre-commit-install = { cmd = "pre-commit install", description = "Install pre-commit hooks in the git repository" }
pre-commit-all = { cmd = "pre-commit run --all-files", description = "Run pre-commit checks on all files" }
pre-commit = { cmd = "pre-commit run", description = "Run pre-commit checks on staged files" }

# Documentation feature for building and previewing the MkDocs site
[feature.docs.dependencies]
mkdocs = ">=1.6.0"
mkdocs-material = ">=9.5.0"

[feature.docs.tasks]
docs-build = { cmd = "mkdocs build --strict", description = "Build the documentation site, failing on warnings" }
docs-serve = { cmd = "mkdocs serve", description = "Serve the documentation site locally with live reload" }

# Onboarding feature for setting up the development environment
[feature.onboard.pypi-dependencies]
ssec-cli = { git = "https://github.com/uw-ssec/ssec-cli.git" }

[feature.onboard.tasks]
ssec-setup = { cmd = "ssec --install-completion", description = "Set up shell completion for ssec-cli" }
onboard = { cmd = "ssec onboard", description = "Run the onboarding process for the SSEC project", depends-on = [
    "pre-commit-install",
    "ssec-setup",
] }

# Evals feature: Inspect (model-level evals) + Harbor (sandboxed agent evals)
# for evaluating skills. See evals/README.md.
[feature.evals.dependencies]
python = ">=3.12,<3.14" # harbor requires >=3.12
# The conda solve otherwise pins importlib-metadata 9.x, which harbor's
# litellm dependency rejects (it requires <9). Pin it here so the conda and
# PyPI halves of this environment agree.
importlib-metadata = "<9"

# Both come from PyPI on purpose. Taking inspect-ai from conda-forge pins
# websockets==17.x in the conda solve, which conflicts with harbor's
# supabase -> realtime chain (websockets<16). A single PyPI resolve settles both.
[feature.evals.pypi-dependencies]
harbor = ">=0.23.0"
inspect-ai = ">=0.3.263"

[feature.evals.tasks]
# --- Inspect ---------------------------------------------------------------
inspect-smoke = { cmd = "inspect eval evals/inspect/skill_eval.py -T smoke=true --model mockllm/model --display plain --log-dir evals/logs/inspect", description = "Every skill eval against canned answers (no API key, deterministic)" }
inspect-skill = { cmd = "inspect eval evals/inspect/skill_eval.py --display plain --log-dir evals/logs/inspect", description = "One skill against a real model, e.g. pixi run -e evals inspect-skill -T name=commit --model anthropic/claude-haiku-4-5" }
inspect-view = { cmd = "inspect view --log-dir evals/logs/inspect", description = "Open the Inspect log viewer for local eval logs" }
# --- Harbor ----------------------------------------------------------------
# Docker build contexts can't follow symlinks out of the context directory, so
# the canonical skills in evals/skills/ are copied into the task's environment
# before each run. The copy is gitignored.
harbor-sync = { cmd = "rm -rf evals/harbor/base/skills && mkdir -p evals/harbor/base/skills && cp -R .agents/skills/* evals/harbor/base/skills/ && cp -R evals/skills/* evals/harbor/base/skills/", description = "Copy every skill into the harbor base image build context (gitignored)" }
harbor-base = { cmd = "docker build -t llmoxie-skill-evals-base:local evals/harbor/base", depends-on = ["harbor-sync"], description = "Build the shared harbor base image: git, fake gh/pixi/okf, all skills" }
harbor-oracle = { cmd = "harbor run -p evals/harbor/tasks -a oracle -o evals/logs/harbor --force-build -q", depends-on = ["harbor-base"], description = "Run every harbor task with the oracle agent (needs Docker)" }
harbor-agent = { cmd = "harbor run -p evals/harbor/tasks -a claude-code -o evals/logs/harbor --force-build", depends-on = ["harbor-base"], description = "Run every harbor task with a real agent, e.g. pixi run -e evals harbor-agent -m anthropic/claude-haiku-4-5" }
harbor-view = { cmd = "harbor view evals/logs/harbor", description = "Open the Harbor trajectory viewer for local job logs" }
# --- Combined --------------------------------------------------------------
evals-smoke = { depends-on = ["inspect-smoke", "harbor-oracle"], description = "Inspect smoke then every harbor task with the oracle agent (needs Docker)" }
